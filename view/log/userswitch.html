{include file="common/header" /}
<button id="goback" style="display:none" type="button"
    class="layui-btn layui-btn-normal layui-btn layui-btn-sm">返回</button>
<table id="userswitch" lay-filter="test"></table>
<script>
    function state(d) {
        if (d.indexOf('↑') !== -1) {
            return '#5FB878';
        } else if (d.indexOf('↓') !== -1) {
            return '#FF5722';
        }
        return '#01AAED';
    }
    layui.use('table', function () {
        var table = layui.table;

        //第一个实例
        table.render({
            elem: '#userswitch',
            url: '/log/userswitchdata' //数据接口
                ,
            page: true //开启分页
                ,
            limit: 100,
            limits: [50, 100, 200, 300],
            skin: 'line' //行边框风格
                ,
            even: true //开启隔行背景
                ,
            size: 'sm' //小尺寸的表格
                ,
            cols: [
                [ //表头
                    {
                        field: 'id',
                        title: '序号',
                        width: 70
                    }, {
                        field: 'date',
                        title: '日期',
                        width: 145
                    }, {
                        field: 'name',
                        title: '昵称',
                        width: 145,
                    }, {
                        field: 'account',
                        title: '账号',
                        width: 145
                    }, {
                        field: 'content',
                        title: '日志'
                    },
                ]
            ],
            done: function (res, curr, count) {
                let that = this.elem.next();
                res.data.forEach(function (item, index) {
                    let tr = that.find(".layui-table-box tbody tr[data-index='" + index +
                        "']");
                    tr.attr({
                        "style": "color:" + state(item.content)
                    });
                });
            },
        });
        //监听行单击事件
        table.on('row(test)', function (obj) {
            if($("#goback").is(':visible')) return;
            table.reload('userswitch', {
                where: { //请求参数（注意：这里面的参数可任意定义，并非下面固定的格式）
                    userid: obj.data.userid //排序字段
                }
            });
            $("#goback").show();
        });
        $("#goback").click(() => {
            $("#goback").hide();
            table.reload('userswitch', {
                where: {
                    userid: "all"
                }
            });
        });
    });
</script>
<style>
    body {
        max-width: 810px;
        box-sizing: border-box;
        margin: 0 auto;
    }
</style>
{include file="common/footer" /}
