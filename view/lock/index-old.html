<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>享购工作台锁屏界面</title>
    <script src="../static/js/jquery-3.4.1.min.js"></script>
    <script src="../static/win10ui/component/layer-v3.0.3/layer/layer.js"></script>
    <style>
        #win10-login {
            background: url('../static/win10ui/img/wallpapers/lock.jpg') no-repeat fixed;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            position: fixed;
            z-index: -1;
            top: 0;
            left: 0;
        }

        #win10-login-box {
            width: 300px;
            overflow: hidden;
            margin: 0 auto;
        }

        .win10-login-box-square {
            width: 105px;
            margin: 0 auto;
            border-radius: 50%;
            background-color: darkgray;
            position: relative;
            overflow: hidden;
        }

        .win10-login-box-square::after {
            content: "";
            display: block;
            padding-bottom: 100%;
        }

        .win10-login-box-square .content {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        input {
            width: 90%;
            display: block;
            border: 0;
            margin: 0 auto;
            line-height: 36px;
            font-size: 20px;
            padding: 0 1em;
            border-radius: 5px;
            margin-bottom: 11px;
        }

        .login-username, .login-password {
            width: 91%;
            font-size: 13px;
            color: #999;
        }

        .office{
            width: 91%;
            font-size: 13px;
            color: #999;
            margin-top:11px;
        }

        .login-password {
            width: calc(91% - 54px);
            -webkit-border-radius: 2px 0 0 2px;
            -moz-border-radius: 2px 0 0 2px;
            border-radius: 5px 0 0 5px;
            margin: 0px;
            float: left;
        }

        .login-submit {
            margin: 0px;
            float: left;
            -webkit-border-radius: 0 5px 5px 0;
            -moz-border-radius: 0 5px 5px 0;
            border-radius: 0 5px 5px 0;
            background-color: #009688;
            width: 54px;
            display: inline-block;
            height: 36px;
            line-height: 36px;
            padding: 0 auto;
            color: #fff;
            white-space: nowrap;
            text-align: center;
            font-size: 14px;
            border: none;
            cursor: pointer;
            opacity: .9;
            filter: alpha(opacity=90);

        }
    </style>
</head>
<body  onkeydown="on_return();">
<div id="win10-login">
    <div style="height: 10%;min-height: 120px"></div>
    <div id="win10-login-box">
        <div class="win10-login-box-square">
            <img src="../static/win10ui/img/avatar.jpg" class="content"/>
        </div>
        <p style="font-size: 24px;color: white;text-align: center">{$username}</p>
        <form>
            <!--密码-->
            <input type="password" placeholder="请输入密码" id="login-paasword" class="login-password">
            <!--登陆按钮-->
            <input type="button"  onclick="javascript:login()" value="登录" id="btn-login" class="login-submit"/>
        </form>
    </div>
</div>
<script>
    
function on_return(){
    if(window.event.keyCode == 13){
     if (document.all('btn-login')!=null){
      document.all('btn-login').click();
      }
    }
}
function login(){
    if(!$('#login-paasword').val()){layer.msg('密码不能为空');return;}
    
    $.post('/login/verify',{
        office:'{$office}'
        ,username:'{$username}'
        ,password:$('#login-paasword').val()
        
    },function(data){
        if(data == 0){
            layer.msg('密码错误！');
        }else if(data == 1){
            // layer.msg('登录成功！');
            window.location.href="../";
        }
    }
    )
}

function lock(){
    layer.msg('屏幕已锁定', {time:1000},function(){});
}
</script>
</body>
</html>
