<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>享购工作台锁屏界面</title>
	<meta name="description" content="particles.js is a lightweight JavaScript library for creating particles.">
	<meta name="author" content="Vincent Garreau" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="stylesheet" media="screen" href="/static/plugin/login/css/style.css">
	<link rel="stylesheet" type="text/css" href="/static/plugin/login/css/reset.css" />
	<script src="../static/js/jquery-3.4.1.min.js"></script>
	<script src="../static/win10ui/component/layer-v3.0.3/layer/layer.js"></script>
	<script>layer.msg('屏幕已锁定', {time:1000},function(){});</script>
</head>

<body onkeydown="on_return();">

	<div id="particles-js">
		<div class="login">
			<div class="win10-login-box-square">
				<img src="../static/win10ui/img/xglogo.png" class="content" />
			</div>
			<div class="login-top">
					{$username}
			</div>
			<div class="login-center clearfix">
				<!--<div class="login-center-img"><img src="/static/plugin/login/img/password.png" /></div>-->
				<div class="login-center-input">
					<input type="password" name="" value="" placeholder="请输入您的密码" id="login-paasword"
						onfocus="this.placeholder=''" onblur="this.placeholder='请输入您的密码'" />
					<div class="login-center-input-text">输入密码解锁</div>
				</div>
			</div>
			<div class="login-button" id="btn-login">
				登录
			</div>
		</div>
		<div class="sk-rotating-plane"></div>
      <canvas id="canvas" style="background:#000;width:1920;height:1080"></canvas>
	</div>

	<!-- scripts -->
	<!--script src="/static/plugin/login/js/particles.min.js"></script>
	<script src="/static/plugin/login/js/app.js"></script-->
  <script>
// 代码雨
window.onload = function () {
var canvas = document.getElementById("canvas");
var context = canvas.getContext("2d");
// 浏览器宽高
var W = window.screen.availWidth;
var H = window.screen.availHeight;
canvas.width = W;
canvas.height = H;
var fontSize = 18;
var colunms = Math.floor(W / fontSize);
// 坐标
var coordinate = [];
for (var i = 0; i < colunms; i++) {
coordinate.push(0);
}
var str = "javascript html5 canvas";
function draw() {
// 背景色
context.fillStyle = "rgba(0,0,0,0.05)";
context.fillRect(0, 0, W, H);
context.font = "800 " + fontSize + "px  宋体";
// 字体颜色
context.fillStyle = "#01fef5";
for (var i = 0; i < colunms; i++) {
	var index = Math.floor(Math.random() * str.length);
	var x = i * fontSize;
	var y = coordinate[i] * fontSize;
	context.fillText(str[index], x, y);
	if (y >= canvas.height && Math.random() > 0.88) {
		coordinate[i] = 0;
	}
	coordinate[i]++;
}
}

function randColor() {
var r = Math.floor(Math.random() * 256);
var g = Math.floor(Math.random() * 256);
var b = Math.floor(Math.random() * 256);
return "rgb(" + r + "," + g + "," + b + ")";
}

draw();
setInterval(draw, 30);
};
</script>
	<script type="text/javascript">
		function on_return() {
			if (window.event.keyCode == 13) {
				if (document.all('btn-login') != null) {
					document.all('btn-login').click();
				}
			}
		}

		function hasClass(elem, cls) {
			cls = cls || '';
			if (cls.replace(/\s/g, '').length == 0) return false; //当cls没有参数时，返回false
			return new RegExp(' ' + cls + ' ').test(' ' + elem.className + ' ');
		}

		function addClass(ele, cls) {
			if (!hasClass(ele, cls)) {
				ele.className = ele.className == '' ? cls : ele.className + ' ' + cls;
			}
		}

		function removeClass(ele, cls) {
			if (hasClass(ele, cls)) {
				var newClass = ' ' + ele.className.replace(/[\t\r\n]/g, '') + ' ';
				while (newClass.indexOf(' ' + cls + ' ') >= 0) {
					newClass = newClass.replace(' ' + cls + ' ', ' ');
				}
				ele.className = newClass.replace(/^\s+|\s+$/g, '');
			}
		}
		document.querySelector(".login-button").onclick = function () {
			if (!$('#login-paasword').val()) { layer.msg('密码不能为空'); return; }

			addClass(document.querySelector(".login"), "active")
			setTimeout(function () {
				addClass(document.querySelector(".sk-rotating-plane"), "active")
				document.querySelector(".login").style.display = "none"
			}, 500)
			setTimeout(function () {
				removeClass(document.querySelector(".login"), "active")
				removeClass(document.querySelector(".sk-rotating-plane"), "active")
				document.querySelector(".login").style.display = "block"
				// alert("登录成功")
				$.post('/login/verify', {
					office: '{$office}'
					, username: '{$username}'
					, password: $('#login-paasword').val()

				}, function (data) {
					if (data == 0) {
						layer.msg('密码错误！');
					} else if (data == 1) {
						// layer.msg('登录成功！');
						window.location.href = "../";
					}
				}
				)

			}, 1000)
		}

		function lock(){
    layer.msg('屏幕已锁定', {time:1000},function(){});
}
	</script>
</body>

</html>
